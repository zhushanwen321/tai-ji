# 一次性坏包撤销 workflow（手动触发，用完即删）
# 背景：subagent-core@0.10.3 / pi-subagent-workflow@8.14.2 由并行会话在 scope
# 改名中途发布，依赖不存在的 @taiji/* 装不上；本地 token 无写权限（PUT 404），
# 只能借 CI 的 NPM_TOKEN 执行。目标版本硬编码防误触发参数注入。
name: npm unpublish (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Unpublish broken versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm unpublish @zhushanwen/subagent-core@0.10.3 --force
          npm unpublish @zhushanwen/pi-subagent-workflow@8.14.2 --force

      - name: Verify removal
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg_ver in "@zhushanwen/subagent-core/-/subagent-core-0.10.3.tgz" "@zhushanwen/pi-subagent-workflow/-/pi-subagent-workflow-8.14.2.tgz"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${pkg_ver}")
            echo "tarball ${pkg_ver} -> HTTP ${code}"
            if [ "$code" != "404" ]; then
              echo "::error::unpublish 未生效（期望 404，实际 ${code}）"
              exit 1
            fi
          done
