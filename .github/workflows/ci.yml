name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.xyz-harness/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.xyz-harness/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm workspace 单步安装：根 + packages/* + apps/* 一次装完
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: TypeCheck - renderer
        run: pnpm --filter @xyz-agent/frontend run typecheck

      - name: TypeCheck - runtime
        run: pnpm --filter @xyz-agent/runtime run typecheck

      - name: TypeCheck - shared
        run: pnpm --filter @xyz-agent/shared run typecheck

      - name: TypeCheck - pi extensions
        run: pnpm extensions:typecheck

  # SDK 类型同步防漂移：runtime 的 plugin-types 是 single source of truth，
  # plugin-sdk/src/types.ts 由 sync-types.sh 自动生成。此 job 重新生成并要求
  # git diff 为空——任何对 runtime plugin-types 的改动必须同步刷新 SDK types，
  # 否则 CI 失败（防止两份文件再次漂移）。
  sdk-sync:
    name: SDK types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Check plugin-sdk types are synced with runtime
        working-directory: packages/plugin-sdk
        run: pnpm run check-sync

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Test - runtime
        run: pnpm --filter @xyz-agent/runtime run test -- --reporter=junit --outputFile=test-results.xml

      - name: Test - renderer
        run: pnpm --filter @xyz-agent/frontend run test -- --reporter=junit --outputFile=test-results.xml --coverage

      - name: Test - main
        run: pnpm --filter @xyz-agent/electron run test:main

      - name: Test - pi extensions
        run: pnpm extensions:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            packages/runtime/test-results.xml
            packages/renderer/test-results.xml
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/renderer/coverage/
          retention-days: 7

  # E2E 视觉回归（mock 轨 visual-chromium）：只跑像素 diff baseline（S2 W3 交付的
  # visual-chromium project，testMatch **/visual/** + chromium.launch + spawn vite @ VITE_MOCK=true）。
  # 只需 chromium（无需 electron 二进制/build:e2e），ubuntu-latest 轻量；与 lint/typecheck/test 并行
  # （非 needs 依赖故并行），但纳入 build 的 needs（E2E 失败阻塞 release 构建）。
  e2e-visual:
    name: E2E Visual (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Run visual E2E (mock track)
        run: npx playwright test e2e/visual

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-visual
          path: test-results/
          retention-days: 7

  # PR 构建检查：完整 electron-builder 打包流程（与 release 一致），不在 PR 上传产物。
  # needs gate：lint/typecheck/sdk-sync/test/e2e-visual 已知失败时不浪费 mac runner（mac 构建 5-8min）。
  build:
    name: Build
    needs: [lint, typecheck, sdk-sync, test, e2e-visual]
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: false
