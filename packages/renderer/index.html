<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- CSP（integrity-hardening D2c，W2 前置 G2）：指令段说明——
       script-src 'self'：脚本仅限应用自身 bundle，阻断 XSS 注入外源脚本；
       style-src 'unsafe-inline'：Vue 运行时样式注入（scoped style 挂载 / 动态 style 属性）需要；
       img-src data:/blob:：前端生成的内联图标与截图 blob；local-file: 是主进程注册的
       本地图片预览自定义协议（自定义 scheme 不被 'self' 覆盖）；
       font-src data:：[2026-08-25 已无 bundled 字体，改系统栈] 原 @fontsource 字体在打包态
       以内联 data:font/woff2 形态加载，现保留此指令兼容未来自定义字体场景；
       connect-src ws://localhost:*：renderer 连 runtime 的 WebSocket（use-connection 拼
       ws://localhost:<port>，host 是 localhost 非 127.0.0.1；dev HMR 的同源 ws 已被
       'self' 覆盖——Chromium 按 CSP3 scheme 家族规则 http↔ws 匹配同源）；
       media-src 'self' local-file: data:：TTS 朗读音频播放（ai-voice-tts 设计 §7.7）。
       放宽语义 = media 通道整体放宽（此前无 media-src 指令，media 元素由 default-src 'self'
       兜底，本次从仅 'self' 放宽为三源）：local-file: 加载朗读缓存 WAV（主进程 local-file
       协议白名单约束，白名单前缀外 403）+ data: 为既有 win32 完成提示音路径正名（此前
       data: 音频实际被拦，实测靠 violation 才发现——本次显式放行）；blob: 不加（无使用方）。
       安全面依据：用户内容无 audio/video 注入通道——markdown 渲染管线 DOMPurify 标签白名单
       不含 audio/video；local-file: 受 main 侧路径白名单约束。实测（设计前提 8）：无本指令
       时 local-file 音频 media-src violation ×3，补齐后直播 PLAYING。
       frame-src 'self' local-file:：对话流内联预览容器的 sandbox iframe 加载 local-file://
       预览文档（chat-html-support §6.6 D6，v16——HtmlPreviewInline，ADR-0108）。无该指令时
       iframe 回退 default-src 'self' 被拦，本地 HTML 预览不可行；新增后仅放行应用自身与 local-file 协议，远程 http(s)
       iframe 继续被拦。拦截面边界：CSP 对嵌套上下文的每次导航都按创建它的父文档
       frame-src 检查——预览文档自发起的自导航（meta-refresh / location.href 跳远程）
       同样被拦（探针 P-1 实证）。
       依据 dev 实测（W2 门）+ 打包态实测（S3）：round1 违规 ws://localhost:3310（dev）、
       data:font/woff2（打包），逐一最小增量补齐后双态零违规。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: local-file:; font-src 'self' data:; connect-src 'self' ws://localhost:*; media-src 'self' local-file: data:; frame-src 'self' local-file:" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaiJi</title>
  <!-- 2026-08-25：字体改系统栈（system-ui 优先），无 bundled 字体，font-src data: 指令保留兼容。 -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
